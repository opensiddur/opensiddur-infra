[project]
name = "opensiddur-infra"
version = "0.1.0"
description = "Hosted Open Siddur builder and GCP infrastructure"
requires-python = ">=3.12,<3.14"
license = "LGPL-3.0-or-later"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.11,<3",
 "firebase-admin>=6.7,<8", "google-cloud-firestore>=2.20,<3",
 "google-cloud-storage>=3,<4", "google-cloud-tasks>=2.19,<3",
 "google-cloud-run>=0.10,<1", "google-auth>=2.38,<3", "Pillow>=11,<13",
 "PyYAML>=6,<7", "requests>=2.32,<3"
]
[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app/opensiddur_infra"]
[tool.pytest.ini_options]
pythonpath = ["app"]
[tool.ruff]
target-version = "py312"
