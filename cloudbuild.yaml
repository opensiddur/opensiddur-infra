steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, --target, api, -t, '${_REGISTRY}/api:${_RELEASE}', .]
  - name: gcr.io/cloud-builders/docker
    args: [build, --target, worker, -t, '${_REGISTRY}/worker:${_RELEASE}', .]
  - name: gcr.io/cloud-builders/docker
    args: [run, --rm, '${_REGISTRY}/worker:${_RELEASE}', python, scripts/verify_bundle.py]
images: ['${_REGISTRY}/api:${_RELEASE}', '${_REGISTRY}/worker:${_RELEASE}']
timeout: 3600s
options:
  logging: GCS_ONLY
  machineType: E2_HIGHCPU_8
