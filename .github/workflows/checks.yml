name: Checks
on: [push, pull_request, merge_group]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { version: "0.12.21" }
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: python3 scripts/check_retention.py
  production-pins:
    # releases.lock.json is production's: published, full releases only. Development
    # finds its own (scripts/upstream.py resolve prerelease) when it is deployed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/upstream.py check releases.lock.json
        env: { GH_TOKEN: "${{ github.token }}" }
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          {
            node-version: "24",
            cache: npm,
            cache-dependency-path: web/package-lock.json,
          }
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npm --prefix web test
      - run: python3 scripts/check_npm_audit.py
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_version: "1.13.5" }
      - run: terraform -chdir=infrastructure fmt -check -recursive
      - run: terraform -chdir=infrastructure init -backend=false
      - run: terraform -chdir=infrastructure validate
      - run: terraform -chdir=infrastructure test
