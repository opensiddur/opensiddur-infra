name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.12.21" }
      - run: uv sync --frozen --python 3.12
      - run: uv run pytest
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          {
            node-version: "24",
            cache: npm,
            cache-dependency-path: web/package-lock.json,
          }
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npm --prefix web test
      - run: npm --prefix web audit --audit-level=high
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_version: "1.13.5" }
      - run: terraform -chdir=infrastructure fmt -check -recursive
      - run: terraform -chdir=infrastructure init -backend=false
      - run: terraform -chdir=infrastructure validate
