name: Keep development current
# Development (https://opensiddur-builder-dev.web.app/) runs the main branches of infra,
# opensiddur-processor and opensiddur-projects. Redeploy it when any of the three has moved
# since its last deployment (which deploy.sh records): on every merge to main here, and
# daily for the other two, which this repository cannot see. Production follows releases
# instead (release.yml and production.yml).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  schedule: [{ cron: "17 6 * * *" }]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency: upstream-promotion
jobs:
  compare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      changed: ${{ steps.upstream.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Compare development with the newest infra and upstream
        id: upstream
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -o pipefail
          python3 scripts/upstream.py resolve main |
            jq -c --arg commit "$GITHUB_SHA" '{infra_commit: $commit, processor, projects}' > wanted.json
          record=gs://opensiddur-builder-dev-tfstate/deployments/development.json
          if gcloud storage cat "$record" > deployed-record.json 2> read-error; then
            jq -c '{infra_commit, processor, projects}' deployed-record.json > deployed.json
          elif grep -Eqi 'not found|notfound|matched no objects|404' read-error; then
            echo '{}' > deployed.json  # Never recorded: deploy.
          else
            cat read-error >&2
            exit 1
          fi
          echo "Wanted:   $(cat wanted.json)"
          echo "Deployed: $(cat deployed.json)"
          if cmp -s wanted.json deployed.json; then echo 'changed=false' >> "$GITHUB_OUTPUT"; else echo 'changed=true' >> "$GITHUB_OUTPUT"; fi

  development:
    needs: compare
    if: needs.compare.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write
    # deploy.sh finds the newest upstream releases again, and records what it deployed.
    uses: ./.github/workflows/deploy-runtime.yml
    secrets:
      DEPLOY_CONFIG: ${{ secrets.DEPLOY_CONFIG }}
    with:
      environment: dev
      commit: ${{ github.sha }}
