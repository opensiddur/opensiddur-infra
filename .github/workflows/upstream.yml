name: Promote upstream releases
on:
  schedule: [{ cron: "17 6 * * *" }]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency: upstream-promotion
jobs:
  development:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    concurrency: deploy-dev
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Discover new published pair
        id: upstream
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gcloud storage cp gs://opensiddur-builder-dev-tfstate/deployments/upstream-lock.json /tmp/deployed-lock.json 2>/dev/null && cp /tmp/deployed-lock.json releases.lock.json || true
          cp releases.lock.json /tmp/previous-lock.json
          python scripts/check_releases.py
          if cmp -s releases.lock.json /tmp/previous-lock.json; then echo 'changed=false' >> "$GITHUB_OUTPUT"; else echo 'changed=true' >> "$GITHUB_OUTPUT"; fi
      - uses: hashicorp/setup-terraform@v4
        if: steps.upstream.outputs.changed == 'true'
        with: { terraform_version: "1.13.5" }
      - uses: astral-sh/setup-uv@v6
        if: steps.upstream.outputs.changed == 'true'
        with: { version: "0.12.21" }
      - uses: actions/setup-node@v7
        if: steps.upstream.outputs.changed == 'true'
        with: { node-version: "24" }
      - name: Validate and promote development
        if: steps.upstream.outputs.changed == 'true'
        env:
          DEPLOY_CONFIG: ${{ secrets.DEPLOY_CONFIG }}
          TF_CLI_ARGS_apply: -auto-approve
          PRIVACY_OPERATOR: ${{ vars.PRIVACY_OPERATOR }}
          PRIVACY_CONTACT: ${{ vars.PRIVACY_CONTACT }}
          PRIVACY_READY: ${{ vars.PRIVACY_READY }}
          APP_CHECK_SITE_KEY: ${{ vars.APP_CHECK_SITE_KEY }}
          GOOGLE_AUTH_ENABLED: ${{ vars.GOOGLE_AUTH_ENABLED }}
        run: |
          mkdir -p .runtime
          printf '%s\n' "$DEPLOY_CONFIG" > .runtime/dev.auto.tfvars
          bash scripts/deploy.sh dev
          gcloud storage cp releases.lock.json gs://opensiddur-builder-dev-tfstate/deployments/upstream-lock.json
