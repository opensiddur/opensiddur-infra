name: Deploy
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
jobs:
  development:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-runtime.yml
    secrets:
      DEPLOY_CONFIG: ${{ secrets.DEPLOY_CONFIG }}
    with:
      environment: dev
      commit: ${{ github.sha }}
