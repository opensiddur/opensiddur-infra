name: Deploy
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [dev, prod]
        default: dev
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency: deploy-${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v4
        with: { terraform_version: "1.13.5" }
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.12.21" }
      - uses: actions/setup-node@v7
        with: { node-version: "24" }
      - name: Recover environment configuration
        env:
          DEPLOY_CONFIG: ${{ secrets.DEPLOY_CONFIG }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          mkdir -p .runtime
          printf '%s\n' "$DEPLOY_CONFIG" > ".runtime/$ENVIRONMENT.auto.tfvars"
      - name: Deploy
        env:
          TF_CLI_ARGS_apply: -auto-approve
          PRIVACY_OPERATOR: ${{ vars.PRIVACY_OPERATOR }}
          PRIVACY_CONTACT: ${{ vars.PRIVACY_CONTACT }}
          PRIVACY_READY: ${{ vars.PRIVACY_READY }}
          APP_CHECK_SITE_KEY: ${{ vars.APP_CHECK_SITE_KEY }}
          GOOGLE_AUTH_ENABLED: ${{ vars.GOOGLE_AUTH_ENABLED }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: bash scripts/deploy.sh "$ENVIRONMENT"
